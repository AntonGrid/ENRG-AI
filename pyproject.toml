[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enrg-ai"
version = "0.1.0"
description = "ENRG-AI — intelligence layer of the AXIS ecosystem: hybrid AI oracle, federated learning, market signals"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ollama",
    "numpy>=1.24",
    "httpx>=0.24",
    "PyNaCl>=1.5",
    # ``agent/backtest/power.py`` reads the gate's power from a noncentral t distribution,
    # and ``walkforward`` imports it on every run: the gate's arithmetic is part of the
    # verdict, not an optional extra, so a base install without scipy cannot print a verdict
    # at all. It was an ``organism`` extra, which is why the first image that tried to
    # reproduce the grid failed on import.
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
plot = [
    "matplotlib>=3.7",
]
organism = [
    "scikit-learn>=1.3",
]
notebook = [
    "pandas>=2.0",
    "matplotlib>=3.7",
    "nbformat>=5.9",
    "nbclient>=0.9",
    "ipython>=8.0",
]
testnet = [
    "web3>=6.0",
    "python-dotenv>=1.0",
]
market = [
    "requests>=2.28",
]

[tool.setuptools.packages.find]
include = ["agent", "agent.*"]
exclude = ["tests", "tests.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
