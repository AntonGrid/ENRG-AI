[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enrg-ai"
version = "0.1.0"
description = "ENRG-AI — intelligence layer of the AXIS ecosystem: hybrid AI oracle, federated learning, market signals"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ollama",
    "numpy>=1.24",
    "httpx>=0.24",
    "PyNaCl>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
include = ["agent", "agent.*"]
exclude = ["tests", "tests.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
