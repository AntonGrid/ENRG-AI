name: AI signals (assessments.json)

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signals
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet numpy httpx PyNaCl

      - name: Generate signed AI-oracle attestation
        run: python scripts/publish_signals.py --source online --output docs/ai/assessments.json
        env:
          AXIS_AI_SIGNING_KEY: ${{ secrets.AXIS_AI_SIGNING_KEY }}

      - name: Publish to GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs
          publish_branch: gh-pages
          force_orphan: false
          user_name: "enrg-ai-bot"
          user_email: "enrg-ai-bot@users.noreply.github.com"
